<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#glow)" />

  <!-- Gold Coin Body -->
  <circle cx="256" cy="256" r="150" fill="url(#coinGrad)" stroke="#FFFFFF" stroke-width="8" />

  <!-- Inner Coin Detail Ring -->
  <circle cx="256" cy="256" r="122" fill="none" stroke="#854D0E" stroke-width="5" stroke-dasharray="10 8" />

  <!-- Dollar Symbol -->
  <text x="256" y="320" font-family="'Inter', system-ui, sans-serif" font-size="200" font-weight="900" text-anchor="middle" fill="#0F172A">
    $
  </text>
  <text x="252" y="316" font-family="'Inter', system-ui, sans-serif" font-size="200" font-weight="900" text-anchor="middle" fill="#FFFFFF">
    $
  </text>

  <!-- Growth Spark / Arrow -->
  <path d="M360 130 L425 130 L425 195 M425 130 L335 220" fill="none" stroke="#FDE047" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
</svg>
